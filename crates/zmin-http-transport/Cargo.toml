[package]
name = "zmin-http-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
bytes = "1.11.1"
base64 = "0.22.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
http = "1.4.0"
futures-util = "0.3.32"
hyper = { version = "1.10.1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "http2", "tokio"] }
ipnet = "2.12.0"
pin-project-lite = "0.2.17"
percent-encoding = "2.3.2"
rustls = { version = "0.23.34", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.0"
sha2 = "0.10.9"
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12"] }
tower-service = "0.3.3"
url = "2.5.7"
zeroize = "1.8.2"
