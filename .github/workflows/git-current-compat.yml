name: Current Git compatibility replay

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Build and preparation concurrency"
        required: true
        type: string
        default: "4"
      per_test_timeout:
        description: "Per-test timeout in seconds; nonzero marks the run diagnostic"
        required: true
        type: string
        default: "0"
  push:
    branches:
      - compat/current-git-v2.55-replay

permissions:
  contents: read

concurrency:
  group: git-current-compat-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  replay:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/compat/current-git-v2.55-replay' &&
           github.event.deleted == false &&
           github.event.forced == false &&
           (github.event.created == true ||
            (github.event.created == false &&
             github.event.before == '18a0f0d455337385e1b6a25312fb15879cdf5145' &&
             github.event.head_commit != null &&
             contains(github.event.head_commit.message, 'Replay-Current-Git: true'))) &&
           github.run_attempt == 1) }}
    name: Current Git replay (Linux x86_64)
    # 1,045 upstream files can take most of a runner allocation.  Keep the
    # authority lane bounded by the maximum GitHub-hosted-job timeout.
    timeout-minutes: 360
    runs-on: ubuntu-24.04
    env:
      REPLAY_JOBS: ${{ inputs.jobs || '4' }}
      REPLAY_PER_TEST_TIMEOUT: ${{ inputs.per_test_timeout || '0' }}
      REPLAY_RUST_TOOLCHAIN: "1.98.0-x86_64-unknown-linux-gnu"
      REPLAY_PROFILE: linux-ubuntu-24.04-x86_64
      RUSTUP_MAX_RETRIES: "0"
      CARGO_NET_RETRY: "0"
      CARGO_HTTP_TIMEOUT: "30"
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify checkout and native runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(getconf LONG_BIT)" = 64
          test ! -e "$GITHUB_WORKSPACE/.tmp"
          mkdir -p "$GITHUB_WORKSPACE/.replay/artifacts"

      - name: Install pinned Git test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          sudo -n apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          apt_packages=(
            bash build-essential ca-certificates curl file findutils gawk gettext
            git make perl python3 rsync tar zlib1g-dev libssl-dev
            libcurl4-openssl-dev libexpat1-dev libpcre2-dev libzstd-dev liblz4-dev
            tcl tk cvs cvsps subversion apache2 apache2-utils libapache2-mod-svn
            locales openssl openssh-client gnupg sudo openjdk-17-jre-headless
            libhttp-date-perl libtimedate-perl highlight
            libsvn-perl libcgi-pm-perl libdbi-perl libdbd-sqlite3-perl
            libjson-perl libwww-perl liberror-perl libauthen-sasl-perl
            libintl-perl
            ripgrep
          )
          missing_packages=()
          for package in "${apt_packages[@]}"; do
            apt-cache show "$package" >/dev/null 2>&1 || missing_packages+=("$package")
          done
          mkdir -p "$GITHUB_WORKSPACE/.replay/artifacts"
          if ((${#missing_packages[@]})); then
            printf 'apt_required_missing\t%s\n' "${missing_packages[*]}" >"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"
            printf 'Required Git compatibility dependencies are unavailable: %s\n' "${missing_packages[*]}" >&2
            exit 1
          fi
          sudo -n apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends "${apt_packages[@]}"
          printf 'apt_required_missing\tnone\n' >"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"
          path_is_safe() {
            local value="$1"
            [[ -n "$value" && "$value" == /* && "$value" != *$'\n'* && "$value" != *$'\r'* ]] || return 1
            python3 -c 'import sys; value=sys.argv[1]; value.encode("utf-8").decode("utf-8"); assert all((ord(ch) >= 32 and ord(ch) != 127) or ch == "\t" for ch in value)' "$value"
          }
          assert_ambient_canonical() {
            local command_name="$1" path canonical
            path="$(command -v "$command_name")"
            path_is_safe "$path"
            canonical="$(realpath -e -- "$path")"
            test "$canonical" = "$path"
          }
          for command in apt-cache apt-get awk curl dpkg-query grep realpath sha256sum stat mktemp mv chmod python3 sudo; do
            assert_ambient_canonical "$command"
          done
          rustup_path="$(command -v rustup)"
          path_is_safe "$rustup_path" || exit 1
          rustup_path="$(realpath -e -- "$rustup_path")"
          path_is_safe "$rustup_path" || exit 1
          [[ -f "$rustup_path" && -x "$rustup_path" && ! -L "$rustup_path" ]] || exit 1
          rustup_path_again="$(realpath -e -- "$rustup_path")"
          [[ "$rustup_path_again" == "$rustup_path" ]] || exit 1
          printf 'ZMIN_REPLAY_RUSTUP=%s\n' "$rustup_path" >>"$GITHUB_ENV"
          export ZMIN_REPLAY_RUSTUP="$rustup_path"
          toolbin="$GITHUB_WORKSPACE/.replay/toolbin"
          mkdir -p "$toolbin"
          download_verified() {
            local name="$1" url="$2" expected_sha="$3" expected_size="$4"
            local destination final="$toolbin/$name"
            destination="$(mktemp "$toolbin/.${name}.tmp.XXXXXX")"
            [[ ! -e "$final" && ! -L "$final" ]] || exit 1
            curl -fsSL --connect-timeout 30 --max-time 600 "$url" -o "$destination"
            [[ -f "$destination" && ! -L "$destination" ]] || exit 1
            test "$(stat -c '%s' "$destination")" = "$expected_size"
            test "$(sha256sum "$destination" | awk '{ print $1 }')" = "$expected_sha"
            mv -- "$destination" "$final"
            chmod 0555 "$final"
            [[ -f "$final" && ! -L "$final" && "$(stat -c '%s' "$final")" = "$expected_size" ]] || exit 1
            test "$(stat -c '%a' "$final")" = 555
          }
          download_verified p4 \
            https://ftp.perforce.com/perforce/r23.2/bin.linux26x86_64/p4 \
            7b73445a34e1d067c3092838a302a284ae15bc7068dbc1e7e5d3ae4c3833f248 10587624
          download_verified p4d \
            https://ftp.perforce.com/perforce/r23.2/bin.linux26x86_64/p4d \
            cab870ae52cea689e9a839d95be8f62b012ffd40ac7e99d381f2663a13679f2d 18181064
          download_verified jgit \
            https://repo1.maven.org/maven2/org/eclipse/jgit/org.eclipse.jgit.pgm/6.8.0.202311291450-r/org.eclipse.jgit.pgm-6.8.0.202311291450-r.sh \
            764f272c3857da1acaa26689f187a5b38d6597f766c91db649300fd0b8225fa9 27037916
          printf 'provisioned_tool\tp4\tr23.2\t%s\n' \
            "$(sha256sum "$toolbin/p4" | awk '{ print $1 }')" >>"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"
          printf 'provisioned_tool\tp4d\tr23.2\t%s\n' \
            "$(sha256sum "$toolbin/p4d" | awk '{ print $1 }')" >>"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"
          printf 'provisioned_tool\tjgit\t6.8.0.202311291450-r\t%s\n' \
            "$(sha256sum "$toolbin/jgit" | awk '{ print $1 }')" >>"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"
          export PATH="$toolbin:/usr/bin:/bin:/usr/sbin:/sbin"
          "$ZMIN_REPLAY_RUSTUP" toolchain install "$REPLAY_RUST_TOOLCHAIN" --profile minimal --no-self-update
          for package in "${apt_packages[@]}"; do
            dpkg-query -W -f='apt_package\t${Package}\t${Version}\t${Status}\n' "$package" \
              >>"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"
          done
          for command in awk bash cat comm curl cvs cvsps df diff du envsubst find gcc git grep gpg highlight iconv java jgit make msgfmt openssl p4 p4d perl python3 realpath rg sed sha256sum shasum sh ssh sort svn svnadmin svnmucc svnserve tar timeout tr uniq uname wc cc ar ranlib apache2 apache2ctl locale locale-gen sudo; do
            command_path="$(command -v "$command")"
            path_is_safe "$command_path"
            command_path="$(realpath -e -- "$command_path")"
            [[ -f "$command_path" && -x "$command_path" && ! -L "$command_path" ]] || exit 1
            printf 'command_path\t%s\t%s\n' "$command" "$command_path" \
              >>"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"
            printf 'command_version\t%s\t%s\n' "$command" \
              "$($command --version 2>&1 | head -n 1 | tr '\n' ';' || true)" \
              >>"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"
          done
          canonical_required_executable() {
            local variable="$1"
            local command_name="$2"
            local command_path canonical canonical_again
            IFS= read -r -d '' command_path < <(command -v "$command_name"; printf '\0') || {
              printf 'required executable lookup failed: %s (%s)\n' "$variable" "$command_name" >&2
              exit 1
            }
            path_is_safe "$command_path" || {
              printf 'required executable lookup is invalid: %s (%s)\n' "$variable" "$command_name" >&2
              exit 1
            }
            IFS= read -r -d '' canonical < <(realpath -e -- "$command_path" 2>/dev/null; printf '\0') || {
              printf 'required executable canonicalization failed: %s (%s)\n' "$variable" "$command_name" >&2
              exit 1
            }
            path_is_safe "$canonical" &&
              [[ -n "$canonical" && "$canonical" == /* &&
              -f "$canonical" && -x "$canonical" && ! -L "$canonical" ]] || {
              printf 'required executable is not a canonical regular executable: %s (%s)\n' \
                "$variable" "$command_name" >&2
              exit 1
            }
            IFS= read -r -d '' canonical_again < <(realpath -e -- "$canonical" 2>/dev/null; printf '\0') || {
              printf 'required executable canonicalization recheck failed: %s (%s)\n' \
                "$variable" "$command_name" >&2
              exit 1
            }
            [[ "$canonical_again" == "$canonical" ]] || {
              printf 'required executable canonicalization is unstable: %s (%s)\n' \
                "$variable" "$command_name" >&2
              exit 1
            }
            printf '%s=%s\n' "$variable" "$canonical" >>"$GITHUB_ENV"
            printf 'runtime_executable\t%s\t%s\t%s\n' \
              "$variable" "$command_name" "$canonical" \
              >>"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"
          }
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_GIT git
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_PYTHON python3
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_MAKE make
          canonical_required_executable ZMIN_TEST_PERL perl
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_SHELL sh
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_CC cc
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_AR ar
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_RANLIB ranlib
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_CURL curl
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_OPENSSL openssl
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_P4 p4
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_P4D p4d
          canonical_required_executable ZMIN_UPSTREAM_CONTRACT_JGIT jgit
          test "$(jgit --version 2>&1)" = 'jgit version 6.8.0.202311291450-r'
          perl -MDigest::SHA -MGit -MSVN::Core -MSVN::Repos -MSVN::Ra -MSVN::Delta \
            -MSVN::Client -MDBI -MDBD::SQLite -MCGI::Util -MCGI::Carp \
            -MTime::HiRes -MEncode -MCompress::Zlib -MLocale::Messages -e '1'
          cvsps --version 2>&1 | grep -Eq '2\.(1|2)($|[^0-9])'
          java -version 2>&1 | awk 'NR == 1 && $0 ~ /version "(1[1-9]|[2-9][0-9])\./ { found=1 } END { exit !found }'
          apache2 -v | awk 'NR == 1 && $0 ~ /Apache\/2\.([4-9]|[1-9][0-9])/ { found=1 } END { exit !found }'
          for module in cgi dav dav_fs dav_svn ssl auth_basic; do sudo -n a2enmod "$module" >/dev/null; done
          apache2ctl -M 2>/dev/null | grep -q 'dav_svn_module'
          apache2ctl -M 2>/dev/null | grep -q 'ssl_module'
          test "$(id -u)" != 0
          test "$(id -un)" = "$(stat -c '%U' "$GITHUB_WORKSPACE")"
          python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); s.close()'
          sudo -n localedef -i en_US -f UTF-8 en_US.UTF-8
          sudo -n localedef -i is_IS -f UTF-8 is_IS.UTF-8
          utf8_locale="$(locale -a | awk 'tolower($0) == "en_us.utf8" || tolower($0) == "en_us.utf-8" { print; exit }')"
          test -n "$utf8_locale"
          locale -a | awk 'tolower($0) == "is_is.utf8" || tolower($0) == "is_is.utf-8" { found=1 } END { exit !found }'
          printf 'GIT_TEST_UTF8_LOCALE=%s\n' "$utf8_locale" >>"$GITHUB_ENV"
          printf 'runtime_profile\t%s\n' "$REPLAY_PROFILE" >>"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"
          {
            printf 'PATH=%s\n' "$PATH"
            printf 'GIT_TEST_HTTPD=true\n'
            printf 'GIT_TEST_SVNSERVE=true\n'
            printf 'GIT_TEST_SVN_HTTPD=true\n'
            printf 'GIT_TEST_ALLOW_SUDO=YES\n'
            printf 'GIT_TEST_CLONE_2GB=false\n'
            printf 'IKNOWWHATIAMDOING=NO\n'
            printf 'LANG=C\nLC_ALL=C\nTZ=UTC\n'
          } >>"$GITHUB_ENV"
          test "$("$ZMIN_REPLAY_RUSTUP" toolchain list | awk -v toolchain="$REPLAY_RUST_TOOLCHAIN" '$1 == toolchain { print $1; exit }')" = "$REPLAY_RUST_TOOLCHAIN"
          rustc_verbose="$("$ZMIN_REPLAY_RUSTUP" run "$REPLAY_RUST_TOOLCHAIN" rustc --version --verbose)"
          test "$(printf '%s\n' "$rustc_verbose" | awk 'NR == 1 { print; exit }')" = 'rustc 1.98.0 (88d9e12ae 2026-08-18)'
          test "$(printf '%s\n' "$rustc_verbose" | awk '$1 == "host:" { print $2; exit }')" = x86_64-unknown-linux-gnu
          cargo_version="$("$ZMIN_REPLAY_RUSTUP" run "$REPLAY_RUST_TOOLCHAIN" cargo --version)"
          case "$cargo_version" in
            'cargo 1.98.0 ('*) ;;
            *) exit 1 ;;
          esac
          {
            printf 'rustup_path\t%s\n' "$ZMIN_REPLAY_RUSTUP"
            printf 'rustup_toolchain\t%s\n' "$("$ZMIN_REPLAY_RUSTUP" toolchain list | tr '\n' ';')"
            printf 'rust_toolchain\t%s\n' "$REPLAY_RUST_TOOLCHAIN"
            printf 'cargo_path\t%s\n' "$("$ZMIN_REPLAY_RUSTUP" which --toolchain "$REPLAY_RUST_TOOLCHAIN" cargo)"
            printf 'cargo_version\t%s\n' "$cargo_version"
            printf 'rustc_path\t%s\n' "$("$ZMIN_REPLAY_RUSTUP" which --toolchain "$REPLAY_RUST_TOOLCHAIN" rustc)"
            printf 'rustc_version\t%s\n' "$(printf '%s\n' "$rustc_verbose" | tr '\n' ';')"
            printf 'git_path\t%s\n' "$(command -v git)"
            printf 'git_version\t%s\n' "$(git --version)"
          } >>"$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv"

      - name: Run stock control and Zmin replay
        id: replay
        if: always()
        shell: bash
        continue-on-error: true
        env:
          CARGO_HOME: ${{ github.workspace }}/.replay/work/cargo-home
        run: |
          set +e
          bash tools/git-current-compat-replay.sh \
            "$REPLAY_JOBS" \
            "$REPLAY_PER_TEST_TIMEOUT" \
            "$GITHUB_WORKSPACE/.replay/artifacts"
          rc=$?
          printf 'exit_code=%s\n' "$rc" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Collect infrastructure outcome
        if: always()
        shell: bash
        env:
          REPLAY_STEP_EXIT: ${{ steps.replay.outputs.exit_code }}
        run: |
          set +e
          artifact_root="$GITHUB_WORKSPACE/.replay/artifacts"
          mkdir -p "$artifact_root"
          if [[ -f "$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv" && ! -f "$artifact_root/dependency-preflight.tsv" ]]; then
            cp "$GITHUB_WORKSPACE/.replay/dependency-preflight.tsv" "$artifact_root/dependency-preflight.tsv"
          fi
          if [[ ! -f "$artifact_root/outcome.tsv" ]]; then
            {
              printf 'result\tfail\n'
              printf 'exit_code\t2\n'
              printf 'reason\tinfrastructure failed before replay outcome was written\n'
              printf 'replay_step_exit\t%s\n' "${REPLAY_STEP_EXIT:-missing}"
            } >"$artifact_root/outcome.tsv"
          fi
          {
            printf 'collector\tworkflow infrastructure\n'
            printf 'runner_os\t%s\n' "${RUNNER_OS:-unknown}"
            printf 'uname\t%s\n' "$(uname -a 2>/dev/null || true)"
            printf 'checkout\t%s\n' "$(git rev-parse HEAD 2>/dev/null || printf unavailable)"
            printf 'replay_step_exit\t%s\n' "${REPLAY_STEP_EXIT:-missing}"
          } >"$artifact_root/infrastructure-collector.tsv"
          (
            cd "$artifact_root"
            while IFS= read -r -d '' file; do
              sha256sum "${file#./}"
            done < <(find . -type f ! -name checksums.sha256 -print0 | LC_ALL=C sort -z)
          ) >"$artifact_root/checksums.sha256"

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: git-current-compat-full1045-${{ github.sha }}
          path: .replay/artifacts
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Fail according to replay outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          outcome_file="$GITHUB_WORKSPACE/.replay/artifacts/outcome.tsv"
          test -f "$outcome_file"
          stored_exit="$(awk -F '\t' '$1 == "exit_code" { print $2; exit }' "$outcome_file")"
          test -n "$stored_exit"
          test "$stored_exit" -eq 0
